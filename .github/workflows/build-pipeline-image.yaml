name: Build and push pipeline image

on:
  push:
    branches: [main]
    paths:
      - 'pipeline.Dockerfile'
      - 'taro/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

concurrency:
  group: pipeline-image-build
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/taro-github-actions-pipeline-build
          aws-region: eu-central-1
          role-duration-seconds: 900   # 15min - the actual session length; the role's own max_session_duration (1h, AWS's own floor) is just the outer ceiling

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3   # needed to cross-build arm64 on an x86_64 runner
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: pipeline.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/taro:pipeline
            ${{ steps.ecr-login.outputs.registry }}/taro:pipeline-${{ github.sha }}
