name: Build and push pipeline image

on:
  push:
    branches: [main]
    paths:
      - 'pipeline.Dockerfile'
      - 'taro/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

concurrency:
  group: pipeline-image-build
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/taro-github-actions-pipeline-build
          aws-region: eu-central-1
          role-duration-seconds: 900   # 15min - the actual session length; the role's own max_session_duration (1h, AWS's own floor) is just the outer ceiling

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      # needed to cross-build arm64 on an x86_64 runner
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pipeline.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/taro:pipeline
            ${{ steps.ecr-login.outputs.registry }}/taro:pipeline-${{ github.sha }}
