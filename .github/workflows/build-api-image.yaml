name: Build, push and deploy API image

on:
  push:
    branches: [main]
    paths:
      - 'api_lambda.Dockerfile'
      - 'api/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - .github/workflows/build-api-image.yaml
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

concurrency:
  group: api-image-build
  cancel-in-progress: true

jobs:
  # Kept in its own file (test.yaml) so it still runs standalone on PRs
  # too, not just here - called as a job via workflow_call rather than
  # duplicated, so this is a real gate (via needs:) rather than a loosely
  # correlated workflow_run reaction.
  test:
    uses: ./.github/workflows/test.yaml

  # A strictly linear chain (test -> build-dev -> deploy-dev -> build-prod
  # -> deploy-prod) rather than build-once-promote: build-prod is a fresh
  # build+push of the same commit, not a re-deploy of build-dev's image, and
  # it's gated behind manual approval exactly like deploy-prod is - so
  # nothing prod-bound (image included) happens without a human clicking
  # approve first.
  build-dev:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/taro-github-actions-api-build
          aws-region: eu-central-1
          role-duration-seconds: 900   # 15min - the actual session length; the role's own max_session_duration (1h, AWS's own floor) is just the outer ceiling

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3   # needed to cross-build arm64 on an x86_64 runner
      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api_lambda.Dockerfile
          platforms: linux/arm64
          push: true
          # Lambda's container image support only understands the older
          # Docker Image Manifest v2/Schema2 format, not OCI. build-push-action
          # defaults to generating a provenance attestation, which forces the
          # push into an OCI image index Lambda's CreateFunction rejects
          # outright ("image manifest ... not supported") - unrelated to
          # whether the image itself is otherwise correct.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/taro:api
            ${{ steps.ecr-login.outputs.registry }}/taro:api-${{ github.sha }}

      # Digest-pinned rather than the moving :api tag - deploy-dev below
      # deploys this exact reference directly via `aws lambda
      # update-function-code --image-uri`, so which build is live is never
      # ambiguous the way a shared mutable tag would be. Terraform's
      # aws_lambda_function.api deliberately can't do this part - image_uri
      # = "<repo>:api" is a tag string that never changes even as the tag's
      # digest moves, so a plain `terraform apply` can never detect a new
      # push. See MIGRATION.md.
      - id: image
        run: echo "uri=${{ steps.ecr-login.outputs.registry }}/taro@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: build-dev
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/taro-github-actions-api-build
          aws-region: eu-central-1
          role-duration-seconds: 900

      - name: Deploy to taro-dev-api
        run: |
          aws lambda update-function-code \
            --function-name taro-dev-api \
            --image-uri ${{ needs.build-dev.outputs.image_uri }} \
            > /dev/null
          aws lambda wait function-updated --function-name taro-dev-api

  # Only starts once deploy-dev succeeds, and pauses for manual approval in
  # the Actions UI before it does - the "production" environment has a
  # required-reviewer protection rule configured in the repo settings (not
  # something expressible in this YAML file itself), which is what actually
  # creates the gate. Unlike build-dev, this build doesn't start - and
  # nothing gets pushed to ECR under the :api tag as "the latest prod
  # build" - until that approval happens.
  build-prod:
    needs: deploy-dev
    environment: production
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/taro-github-actions-api-build
          aws-region: eu-central-1
          role-duration-seconds: 900

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api_lambda.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/taro:api
            ${{ steps.ecr-login.outputs.registry }}/taro:api-${{ github.sha }}

      - id: image
        run: echo "uri=${{ steps.ecr-login.outputs.registry }}/taro@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy-prod:
    needs: build-prod
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/taro-github-actions-api-build
          aws-region: eu-central-1
          role-duration-seconds: 900

      - name: Deploy to taro-production-api
        run: |
          aws lambda update-function-code \
            --function-name taro-production-api \
            --image-uri ${{ needs.build-prod.outputs.image_uri }} \
            > /dev/null
          aws lambda wait function-updated --function-name taro-production-api
