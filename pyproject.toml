[project]
name = "taro"
version = "0.0.1"
description = "Data pipelines and API backend for the arms-tracker app"
authors = [
    { name = "Frederik Laubisch", email = "kafkaese@gmail.com" },
]
requires-python = ">=3.8"
dependencies = [
    "beautifulsoup4==4.12.2",
    "curl_cffi==0.7.1",
    "fastapi==0.96.0",
    "pandas==2.0.2",
    "psycopg2==2.9.6",
    "requests==2.31.0",
    "SQLAlchemy==2.0.15",
]

[project.optional-dependencies]
api = [
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest==7.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taro"]