[project]
name = "taro"
version = "0.0.1"
description = "Data pipelines and API backend for the arms-tracker app"
authors = [
    { name = "Frederik Laubisch", email = "kafkaese@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0,<5",
    "curl_cffi>=0.15.0,<0.16",
    "fastapi>=0.139.0,<0.140",
    "pandas>=3.0.3,<4",
    "numpy>=2.5.1,<3",
    "psycopg[binary]>=3.3.4,<4",
    "requests>=2.34.2,<3",
    "SQLAlchemy>=2.0.51,<3",
    "s3fs",
]

[project.optional-dependencies]
api = [
    "uvicorn>=0.51.0,<0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taro"]